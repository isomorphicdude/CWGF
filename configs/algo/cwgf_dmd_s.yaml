
name: "cwgf_dmd_s"
denoise_term_weight: "linear" #"linear", "sqrt", "log", "square", "trunc_linear", "const", "power2over3"
num_diffusion_steps: 4
num_steps: 100
num_t_samples: 1
cfg_scale: 1.2
timestep_sampling: "cyclic" # "cyclic", "decreasing" or "uniform"
weighting: "inv_snr" # "inv_snr", "edm"


n_particles: 4
w_t: [1.0, 1.0, 1.0, 1.0]
lr_z: 1.0 # latent lr
lr_prompt: 1.0 # prompt lr
vjp_coeff: 0.1
decoder_std: 0.01 # noise std for decoder
prompt_opt: true
prompt_project_radius: 15.0

use_temp: false

init_method: "none" # "none", "pinv"
post_method: "none" # only "none" is supported
